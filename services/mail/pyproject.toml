[project]
name = "treegent-mail"
version = "0.1.0"
description = "TreeGent mail service: agent mailboxes, approval-gated outbound, adapter transport"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "motor>=3.5",
    "dnspython>=2.6",   # mongodb+srv:// (Atlas) URLs
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "treegent-common",
]
