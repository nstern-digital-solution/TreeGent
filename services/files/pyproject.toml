[project]
name = "treegent-files"
version = "0.1.0"
description = "TreeGent files service: S3-backed shared storage with R40 permissions"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "motor>=3.5",
    "dnspython>=2.6",   # mongodb+srv:// (Atlas) URLs
    "pydantic-settings>=2.4",
    "aioboto3>=12.0",
    "python-multipart>=0.0.9",
    "treegent-common",
]
